services:
  - type: web
    name: upstock-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: virginia
    healthCheckPath: /api/ping
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: SHOW_SQL
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://up-stock-kappa.vercel.app,http://localhost:5173,http://localhost:8080"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Dspring.jmx.enabled=false"
