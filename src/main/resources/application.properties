spring.application.name=upstock

# Render/Railway/Fly injetam PORT; local usa 8080
server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno para caber nos 512 MB do free tier e poupar conexões no Neon
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
admin.password=${ADMIN_PASSWORD}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://up-stock-kappa.vercel.app,http://localhost:5173,http://localhost:8080}

logging.level.com.carlos.upstock=WARN
logging.level.org.springframework.security=WARN
